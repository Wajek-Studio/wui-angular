<form [formGroup]="fullForm" (ngSubmit)="simpanFull()" class="wui-flex wui-flex-col wui-gap-col-4 wui-gap-row-4">
  <div class="wui-row wui-gap-col-3">
    <div class="wui-col-12 wui-col-md-6">
      <wui-form-field hint="Nama minimal 3 karakter." [error]="pesanFull('namaLengkap')">
        <label wuiLabel>Nama Lengkap</label>
        <input wuiInput type="text" formControlName="namaLengkap" placeholder="mis. Moch. Rizal" />
      </wui-form-field>
    </div>
    <div class="wui-col-12 wui-col-md-6">
      <wui-form-field hint="Gunakan email aktif." [error]="pesanFull('email')">
        <label wuiLabel>Alamat Email</label>
        <input wuiInput type="email" formControlName="email" placeholder="nama@domain.com" />
      </wui-form-field>
    </div>
  </div>

  <div class="wui-row wui-gap-col-3">
    <div class="wui-col-12 wui-col-md-6">
      <wui-form-field hint="Pilih unit kerja Anda." [error]="pesanFull('departemen')">
        <label wuiLabel>Departemen</label>
        <wui-select
          wuiInput
          placeholder="Pilih departemen"
          [value]="fullForm.controls.departemen.value"
          (valueChange)="onDepartemenChange($event)"
        >
          <wui-option value="it">Teknologi Informasi (IT)</wui-option>
          <wui-option value="marketing">Pemasaran & Bisnis</wui-option>
          <wui-option value="finance">Keuangan & Akuntansi</wui-option>
        </wui-select>
      </wui-form-field>
    </div>
    <div class="wui-col-12 wui-col-md-6">
      <wui-form-field hint="Opsional (maks. 150 karakter)." [error]="pesanFull('catatan')">
        <label wuiLabel>Keterangan Tambahan</label>
        <textarea wuiInput rows="3" formControlName="catatan" placeholder="Catatan opsional..."></textarea>
      </wui-form-field>
    </div>
  </div>

  <div class="wui-mb-3">
    <label class="wui-label-sm wui-d-block wui-mb-3">Tipe Akun</label>
    <wui-radio-group formControlName="tipeAkun">
      <wui-radio-button value="personal">Personal</wui-radio-button>
      <wui-radio-button value="bisnis">Bisnis</wui-radio-button>
      <wui-radio-button value="enterprise">Enterprise</wui-radio-button>
    </wui-radio-group>
  </div>

  <div class="wui-d-flex wui-align-items-center wui-gap-col-3">
    <button wuiButton variant="filled" color="primary" type="submit">Simpan Data</button>
    <button wuiButton variant="outlined" type="button" (click)="resetFull()">Reset</button>
  </div>
</form>

<div class="preview-result wui-mt-3">
  Status: <strong>{{ fullFormStatus }}</strong>
</div>
