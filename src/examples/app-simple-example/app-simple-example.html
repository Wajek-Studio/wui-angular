<wui-app>
    <wui-topbar>
        <div class="wui-topbar-leading">
            <button wuiButton size="lg" iconOnly variant="text" (click)="toggleSidenav()">
                <wui-icon icon="menu"></wui-icon>
            </button>
        </div>
        <div class="wui-topbar-content">
            <span class="wui-title-medium--em">My App</span>
        </div>
    </wui-topbar>

    <wui-sidenav-container>
        <wui-sidenav id="app-simple-sidenav">
            <div class="wui-sidenav-content">
                Sidenav
            </div>
        </wui-sidenav>
        <div wuiSidenavContainerContent>
            Content
        </div>
    </wui-sidenav-container>
</wui-app>
