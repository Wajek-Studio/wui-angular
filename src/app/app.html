<wui-app>
  <wui-topbar>
    <div class="wui-topbar-leading">
      <button wuiButton iconOnly="true" variant="text" size="lg" (click)="toggleSidenav()">
        <wui-icon icon="menu"></wui-icon>
      </button>
    </div>

    <div class="wui-topbar-content"></div>

    <div class="wui-topbar-trailing">
      <button wuiButton iconOnly="true" variant="text" size="lg" (click)="toggleSidenavMode()">
        <wui-icon icon="book-open"></wui-icon>
      </button>
    </div>
  </wui-topbar>

  <wui-sidenav-container>
    <wui-sidenav [mode]="sidenavMode()" [(show)]="sidenavShow">
      <div class="wui-sidenav-content wui-py-4" wuiScrollbar>
        <a wuiSidenavItem label="Memulai" routerLink="/home" routerLinkActive="active">
          <wui-icon icon="play"></wui-icon>
        </a>
        <a wuiSidenavItem label="Tipografi" routerLink="/tipografi" routerLinkActive="active">
          <wui-icon icon="format-font"></wui-icon>
        </a>

        <div wuiSidenavSubheader label="LAYOUT"></div>
        <a wuiSidenavItem label="Page" routerLink="/page" routerLinkActive="active">
          <wui-icon icon="text-box"></wui-icon>
        </a>
        <a wuiSidenavItem label="Flex" routerLink="/flex" routerLinkActive="active">
          <wui-icon icon="flex"></wui-icon>
        </a>
        <a wuiSidenavItem label="Grid" routerLink="/grid" routerLinkActive="active">
          <wui-icon icon="grid"></wui-icon>
        </a>
        <a wuiSidenavItem label="Spacing" routerLink="/spacing" routerLinkActive="active">
          <wui-icon icon="spacing"></wui-icon>
        </a>

        <div wuiSidenavSubheader label="COMPONENTS"></div>
        <a wuiSidenavItem label="Button" routerLink="/button" routerLinkActive="active">
          <wui-icon icon="button-cursor"></wui-icon>
        </a>
        <a wuiSidenavItem label="Text Field" routerLink="/text-field" routerLinkActive="active">
          <wui-icon icon="form-textbox"></wui-icon>
        </a>
        <a wuiSidenavItem label="Select" routerLink="/select" routerLinkActive="active">
          <wui-icon icon="form-select"></wui-icon>
        </a>
        <a wuiSidenavItem label="Radio" routerLink="/radio" routerLinkActive="active">
          <wui-icon icon="radiobox-marked"></wui-icon>
        </a>
        <a wuiSidenavItem label="Dialog" routerLink="/dialog" routerLinkActive="active">
          <wui-icon icon="arrange-bring-forward"></wui-icon>
        </a>
        <a wuiSidenavItem label="Snackbar" routerLink="/snackbar" routerLinkActive="active">
          <wui-icon icon="snackbar"></wui-icon>
        </a>
        <a wuiSidenavItem label="Menu" routerLink="/menu" routerLinkActive="active">
          <wui-icon icon="dots-horizontal-circle"></wui-icon>
        </a>
        <a wuiSidenavItem label="Tab" routerLink="/tabs" routerLinkActive="active">
          <wui-icon icon="tab"></wui-icon>
        </a>
        <a wuiSidenavItem label="Message" routerLink="/message" routerLinkActive="active">
          <wui-icon icon="bell"></wui-icon>
        </a>

        <a wuiSidenavItem label="Table" routerLink="/table" routerLinkActive="active">
          <wui-icon icon="table"></wui-icon>
        </a>

        <div wuiSidenavSubheader label="EXAMPLES"></div>
        <a wuiSidenavItem label="Reactive Forms" routerLink="/form" routerLinkActive="active">
          <wui-icon icon="atom-variant"></wui-icon>
        </a>
        <a wuiSidenavItem label="Form Input" routerLink="/form-input" routerLinkActive="active">
          <wui-icon icon="square-edit-outline"></wui-icon>
        </a>
        
      </div>
    </wui-sidenav>

    <div class="wui-sidenav-container-content">
      <wui-page-host>
        <router-outlet/>
      </wui-page-host>
    </div>
  </wui-sidenav-container>
</wui-app>
