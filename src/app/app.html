<wui-app>
  <wui-topbar>
    <div class="wui-topbar-leading">
      <button wuiButton iconOnly="true" variant="text" size="lg" (click)="toggleSidenavMini()">
        <wui-icon icon="menu"></wui-icon>
      </button>
    </div>

    <div class="wui-topbar-content">
      <span class="wui-title-medium">
        Wajek UI &mdash; WUI
      </span>
    </div>

    <div class="wui-topbar-trailing">
      <button wuiButton iconOnly="true" variant="text" size="lg" (click)="toggleSidenav()">
        <wui-icon icon="account-circle"></wui-icon>
      </button>
    </div>
  </wui-topbar>

  <wui-sidenav-container>
    <wui-sidenav>
      <a class="wui-sidenav-item" routerLink="/home" routerLinkActive="active">
        <wui-icon icon="play"></wui-icon>
        <span class="wui-sidenav-item--label">Memulai</span>
      </a>

      <div class="wui-sidenav-subheader">
        <span class="wui-sidenav-subheader--label">LAYOUT</span>
      </div>
      <a class="wui-sidenav-item" routerLink="/page" routerLinkActive="active">
        <wui-icon icon="text-box"></wui-icon>
        <span class="wui-sidenav-item--label">Page</span>
      </a>

      <div class="wui-sidenav-subheader">
        <span class="wui-sidenav-subheader--label">COMPONENTS</span>
      </div>
      <a class="wui-sidenav-item" routerLink="/button" routerLinkActive="active">
        <wui-icon icon="button-cursor"></wui-icon>
        <span class="wui-sidenav-item--label">Button</span>
      </a>

      <div class="wui-sidenav-subheader">
        <span class="wui-sidenav-subheader--label">BELUM</span>
      </div>
      <a class="wui-sidenav-item" routerLink="/form" routerLinkActive="active">
        <wui-icon icon="form-textbox"></wui-icon>
        <span class="wui-sidenav-item--label">Form Field</span>
      </a>
      <a class="wui-sidenav-item" routerLink="/flex" routerLinkActive="active">
        <wui-icon icon="flex"></wui-icon>
        <span class="wui-sidenav-item--label">Flex</span>
      </a>
      <a class="wui-sidenav-item" routerLink="/grid" routerLinkActive="active">
        <wui-icon icon="grid"></wui-icon>
        <span class="wui-sidenav-item--label">Grid</span>
      </a>
      <a class="wui-sidenav-item" routerLink="/spacing" routerLinkActive="active">
        <wui-icon icon="spacing"></wui-icon>
        <span class="wui-sidenav-item--label">Spacing &amp; Utilities</span>
      </a>
    </wui-sidenav>
