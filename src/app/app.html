<wui-app>
  <wui-topbar>
    <div wuiTopbarLeading>
      <button wuiButton iconOnly="true" variant="text" size="lg" (click)="toggleSidenavMini()">
        <wui-icon icon="menu"></wui-icon>
      </button>
    </div>

    <div wuiTopbarContent>
      <span class="wui-title-medium">
        Wajek UI &mdash; WUI
      </span>
    </div>

    <div wuiTopbarTrailing>
      <button wuiButton iconOnly="true" variant="text" size="lg" (click)="toggleSidenav()">
        <wui-icon icon="account-circle"></wui-icon>
      </button>
    </div>
  </wui-topbar>

  <wui-sidenav-container>
    <wui-sidenav id="app-sidenav">
      <!-- Konten Penuh: mode open (ikon + teks label) -->
      <nav wuiSidenavFull>
        <div wuiSidenavBody wuiScrollbar>
          <a wuiButton variant="text" size="lg" routerLink="/home" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="play"></wui-icon> Memulai
          </a>

          <div wuiSidenavSubheader>Layout</div>

          <a wuiButton variant="text" size="lg" routerLink="/page" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="spacing"></wui-icon>
            Page
          </a>

          <div wuiSidenavSubheader>Components</div>

          <a wuiButton variant="text" size="lg" routerLink="/button" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="button"></wui-icon>
            Button
          </a>

          

          <div wuiSidenavSubheader>Belum</div>

          <a wuiButton variant="text" size="lg" routerLink="/tipografi" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="format-font"></wui-icon>
            Tipografi
          </a>

          

          

          <a wuiButton variant="text" size="lg" routerLink="/dialog" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="dialog"></wui-icon>
            Dialog
          </a>

          <a wuiButton variant="text" size="lg" routerLink="/form" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="form"></wui-icon>
            Form
          </a>

          <a wuiButton variant="text" size="lg" routerLink="/select" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="form-select"></wui-icon>
            Select
          </a>

          <a wuiButton variant="text" size="lg" routerLink="/context-menu" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="dots-vertical"></wui-icon>
            Menu konteks
          </a>

          <a wuiButton variant="text" size="lg" routerLink="/sidenav" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="dock-left"></wui-icon>
            Sidenav
          </a>

          <a wuiButton variant="text" size="lg" routerLink="/table" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="table"></wui-icon>
            Table
          </a>

          <a wuiButton variant="text" size="lg" routerLink="/snackbar" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="snackbar"></wui-icon>
            Snackbar
          </a>

          <a wuiButton variant="text" size="lg" routerLink="/radio" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="radiobox-marked"></wui-icon>
            Radio
          </a>

          

          

          <a wuiButton variant="text" size="lg" routerLink="/grid" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="grid"></wui-icon>
            Grid
          </a>

          <a wuiButton variant="text" size="lg" routerLink="/flex" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="flex"></wui-icon>
            Flex
          </a>

          <a wuiButton variant="text" size="lg" routerLink="/spacing" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="spacing"></wui-icon>
            Spacing &amp; Utilities
          </a>
          
        </div>

        <div wuiSidenavFooter>
          <a wuiButton variant="text" size="lg" routerLink="/setting" routerLinkActive="is-active" wuiSidenavItem>
            <wui-icon icon="settings"></wui-icon>
            Pengaturan
          </a>
        </div>
      </nav>
    </wui-sidenav>
    <div wuiSidenavContainerContent wuiPageHost>
      <router-outlet/>
    </div>
  </wui-sidenav-container>
</wui-app>
