<wui-app>
  <wui-topbar>
    <div class="wui-topbar-leading">
      <button wuiButton iconOnly="true" variant="text" size="lg" (click)="toggleSidenav()">
        <wui-icon icon="menu"></wui-icon>
      </button>
    </div>

    <div class="wui-topbar-content">
      <span class="wui-title-medium">
        Wajek UI &mdash; WUI
      </span>
    </div>

    <div class="wui-topbar-trailing">
      <button wuiButton iconOnly="true" variant="text" size="lg" (click)="toggleSidenavMini()">
        <wui-icon icon="account-circle"></wui-icon>
      </button>
    </div>
  </wui-topbar>

  <wui-sidenav-container>
    <wui-sidenav [id]="sidenavId" [show]="true">
      <div class="wui-sidenav-content" wuiScrollbar>
        <a wuiSidenavItem label="Memulai" routerLink="/home" routerLinkActive="active">
          <wui-icon icon="play"></wui-icon>
        </a>
        <a wuiSidenavItem label="Tipografi" routerLink="/tipografi" routerLinkActive="active">
          <wui-icon icon="format-font"></wui-icon>
        </a>

        <div wuiSidenavSubheader label="LAYOUT"></div>
        <a wuiSidenavItem label="Page" routerLink="/page" routerLinkActive="active">
          <wui-icon icon="text-box"></wui-icon>
        </a>
        <a wuiSidenavItem label="Flex" routerLink="/flex" routerLinkActive="active">
          <wui-icon icon="flex"></wui-icon>
        </a>
        <a wuiSidenavItem label="Grid" routerLink="/grid" routerLinkActive="active">
          <wui-icon icon="grid"></wui-icon>
        </a>
        <a wuiSidenavItem label="Spacing &amp; Utilities" routerLink="/spacing" routerLinkActive="active">
          <wui-icon icon="spacing"></wui-icon>
        </a>

        <div wuiSidenavSubheader label="COMPONENTS"></div>
        <a wuiSidenavItem label="Button" routerLink="/button" routerLinkActive="active">
          <wui-icon icon="button-cursor"></wui-icon>
        </a>
        <a wuiSidenavItem label="Text Field" routerLink="/form" routerLinkActive="active">
          <wui-icon icon="form-textbox"></wui-icon>
        </a>
        <a wuiSidenavItem label="Radio" routerLink="/radio" routerLinkActive="active">
          <wui-icon icon="radiobox-marked"></wui-icon>
        </a>
        <a wuiSidenavItem label="Snackbar" routerLink="/snackbar" routerLinkActive="active">
          <wui-icon icon="snackbar"></wui-icon>
        </a>
      </div>
    </wui-sidenav>

    <div wuiSidenavContainerContent>
      <div wuiPageHost>
        <router-outlet/>
      </div>
    </div>
  </wui-sidenav-container>
</wui-app>
