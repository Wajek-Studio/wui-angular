<ng-template #page>
  <wui-page>
    <div class="wui-page-content" wuiScrollbar>
      <div class="wui-container wui-pb-5 wui-pt-5">

        <h1 class="wui-headline-large--em wui-mb-4">Form Field</h1>

        <div class="wui-mb-4">
          <p><code class="wui-code-inline">&lt;wui-form-field&gt;</code> menyusun label mengapung, kontrol input, petunjuk (<em>hint</em>), dan pesan error. Terintegrasi penuh dengan Reactive Forms Angular.</p>
        </div>

        <h2 class="wui-headline-small--em wui-mb-4">Outlined Showcase</h2>
        <app-showcase>
          <form-simple-example></form-simple-example>
        </app-showcase>

        <!-- <h2 class="wui-headline-small--em wui-mb-4">Filled Showcase</h2>
        <app-showcase>
          <form-filled-example></form-filled-example>
        </app-showcase> -->
      </div>
    </div>
  </wui-page>
</ng-template>
