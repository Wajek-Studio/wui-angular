<ng-template #page>
    <wui-page>
        <div wuiPageContent wuiScrollbar>
            <div wuiContainer class="wui-py-5">
                <h1 class="wui-headline-medium--em wui-mb-4">Wajek UI</h1>

                <div class="wui-mb-5">
                    <p>Wajek UI adalah sebuah library berisi kumpulan User Interface yang siap digunakan. Menerapkan spesifikasi yang mirip Material Design, tapi dikembangkan dengan cara kami.</p>
                </div>

                <h2 class="wui-headline-small--em wui-mb-4">Instalasi</h2>

                <div class="wui-mb-4">
                    <app-code sourceUrl="/examples/installation.script" lang="bash"></app-code>
                </div>

                <div class="wui-mb-4">
                    <p>Lalu buka <code>src/style.scss</code>, tambahkan script berikut :</p>
                </div>

                <div class="wui-mb-5">
                    <app-code sourceUrl="/examples/style-example.scss" lang="scss"></app-code>
                </div>

                <h2 class="wui-headline-small--em wui-mb-4">Template Awal</h2>

                <app-showcase
                    [defaultShowCode]="true"
                    title="wui-app — Shell Aplikasi"
                    description="wui-app dipasang sekali di root aplikasi dan tugasnya hanya mewadahi topbar serta kontennya. Halaman (wui-page) tidak dirender ke wui-app, melainkan ke elemen [wuiPageHost] yang boleh dipasang di bagian mana pun di dalam shell."
                    [tabs]="[{
                        label: 'app-simple-example.html',
                        code: '/examples/app-simple-example/app-simple-example.html',
                        language: 'html'
                    },{
                        label: 'app-simple-example.ts',
                        code: '/examples/app-simple-example/app-simple-example.ts',
                        language: 'typescript'
                    }]"
                >
                    <div class="app-shell wui-border wui-radius-2">
                        <app-simple-example/>
                    </div>
                </app-showcase>
            </div>
        </div>        
    </wui-page>
</ng-template>
