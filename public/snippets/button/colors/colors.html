<!-- Warna Default (Netral) -->
<button wuiButton color="default">Default</button>
<button wuiButton variant="outlined" color="default">Default Outlined</button>

<!-- Warna Primary (Aksen Utama) -->
<button wuiButton color="primary">Primary Filled</button>
<button wuiButton variant="outlined" color="primary">Primary Outlined</button>
<button wuiButton variant="text" color="primary">Primary Text</button>

<!-- Warna Error (Peringatan & Aksi Destruktif) -->
<button wuiButton color="error">Hapus Data</button>
<button wuiButton variant="outlined" color="error">Hapus Outlined</button>
<button wuiButton variant="text" color="error">Batal / Hapus</button>
