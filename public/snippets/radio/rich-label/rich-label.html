<!-- Radio Button dengan Konten Kustom / Label Kaya -->
<wui-radio-group [(ngModel)]="plan" class="wui-flex-column wui-gap-3">
  <wui-radio-button value="free">
    <div>
      <strong>Paket Gratis</strong>
      <p class="plan-desc">Akses fitur dasar untuk eksplorasi dan proyek personal.</p>
    </div>
  </wui-radio-button>

  <wui-radio-button value="pro">
    <div>
      <strong>Paket Profesional (Rp 99.000 / bln)</strong>
      <p class="plan-desc">Dukungan prioritas, penyimpanan tidak terbatas, dan kolaborasi tim.</p>
    </div>
  </wui-radio-button>

  <wui-radio-button value="enterprise">
    <div>
      <strong>Paket Enterprise</strong>
      <p class="plan-desc">Keamanan tingkat lanjut, SLA 99.9%, dan integrasi kustom.</p>
    </div>
  </wui-radio-button>
</wui-radio-group>
