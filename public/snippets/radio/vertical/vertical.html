<!-- Susunan Vertikal dengan Utilitas Flexbox .wui-flex-column -->
<wui-radio-group [(ngModel)]="shippingMethod" class="wui-flex-column wui-gap-3">
  <wui-radio-button value="instant">Pengiriman Instan (1-2 Jam)</wui-radio-button>
  <wui-radio-button value="same-day">Same Day (Tiba Hari Ini)</wui-radio-button>
  <wui-radio-button value="reguler">Reguler (2-3 Hari Kerja)</wui-radio-button>
  <wui-radio-button value="kargo">Kargo / Truk Berat</wui-radio-button>
</wui-radio-group>
