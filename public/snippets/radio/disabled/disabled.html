<!-- Radio Group dalam Status Dinonaktifkan (Disabled) -->
<wui-radio-group [(ngModel)]="selectedStatus" [disabled]="isDisabled">
  <wui-radio-button value="aktif">Aktif</wui-radio-button>
  <wui-radio-button value="arsip">Diarsipkan</wui-radio-button>
  <wui-radio-button value="hapus">Dihapus</wui-radio-button>
</wui-radio-group>
