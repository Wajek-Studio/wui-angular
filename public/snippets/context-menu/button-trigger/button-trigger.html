<!-- 1. Tombol pemicu klik kanan -->
<button wuiButton variant="outlined" [wuiContextMenu]="menuBerkas" class="wui-me-3">
  Klik kanan di sini
</button>

<!-- 2. Buka terprogram lewat kode (mis. tombol klik kiri) -->
<button
  wuiButton
  variant="text"
  [wuiContextMenu]="menuBerkas"
  (click)="bukaTerprogram($event, trgProgram)"
  #trgProgram="wuiContextMenu"
>
  Buka dari kode — buka(x, y)
</button>

<!-- Template Menu Konteks -->
<ng-template #menuBerkas>
  <wui-menu>
    <wui-menu-item (triggered)="aksi('Buka')">
      <wui-icon icon="play" /> Buka
    </wui-menu-item>
    <wui-menu-item typeaheadLabel="Salin berkas" (triggered)="aksi('Salin')">
      <wui-icon icon="form" /> Salin
    </wui-menu-item>
    <hr wuiMenuDivider />
    <wui-menu-item disabled (triggered)="aksi('Hapus (nonaktif)')">
      <wui-icon icon="menu" /> Hapus
    </wui-menu-item>
  </wui-menu>
</ng-template>
