<!-- Tombol pemicu buka dialog modal -->
<button wuiButton variant="filled" (click)="bukaDialog()">Buka dialog</button>

<!-- Template dialog: di dalamnya ada elemen dengan menu konteks -->
<ng-template #dialog>
  <div class="wui-p-4">
    <p class="wui-body-medium wui-mb-3">
      Klik kanan pada kotak di bawah, lalu tekan <code>Esc</code> sekali dan sekali lagi.
    </p>

    <button wuiButton variant="outlined" [wuiContextMenu]="menuDialog">
      Klik kanan di sini
    </button>
  </div>
</ng-template>

<!-- Template menu di dalam dialog -->
<ng-template #menuDialog>
  <wui-menu>
    <wui-menu-item (triggered)="aksi('Ubah')">Ubah</wui-menu-item>
    <wui-menu-item (triggered)="aksi('Duplikat')">Duplikat</wui-menu-item>
  </wui-menu>
</ng-template>
