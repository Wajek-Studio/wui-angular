<div class="wui-row wui-gap-4 wui-align-items-start">
  <div class="wui-col-12 wui-col-md-6">
    <wui-form-field hint="Terdapat 20 opsi pilihan kota dengan nilai aktif ('Bekasi') berada di tengah-tengah.">
      <label wuiLabel>Kota</label>
      <wui-select
        wuiInput
        placeholder="Pilih kota"
        [value]="kota()"
        (valueChange)="kota.set($event)"
      >
        <wui-option>Banda Aceh</wui-option>
        <wui-option>Medan</wui-option>
        <wui-option>Padang</wui-option>
        <wui-option>Pekanbaru</wui-option>
        <wui-option>Batam</wui-option>
        <wui-option>Palembang</wui-option>
        <wui-option>Bandar Lampung</wui-option>
        <wui-option>Jakarta</wui-option>
        <wui-option>Bogor</wui-option>
        <wui-option>Tangerang</wui-option>
        <wui-option>Bekasi</wui-option>
        <wui-option>Bandung</wui-option>
        <wui-option>Cirebon</wui-option>
        <wui-option>Semarang</wui-option>
        <wui-option>Surakarta (Solo)</wui-option>
        <wui-option>Yogyakarta</wui-option>
        <wui-option disabled>Surabaya (nonaktif)</wui-option>
        <wui-option>Malang</wui-option>
        <wui-option>Denpasar</wui-option>
        <wui-option>Makassar</wui-option>
      </wui-select>
    </wui-form-field>

    <div class="wui-mt-3">
      <button wuiButton variant="outlined" (click)="isi()">Pilih Bandung</button>
      <button wuiButton variant="text" (click)="kosongkan()">Kosongkan</button>
    </div>
  </div>

  <div class="wui-col-12 wui-col-md-6">
    <wui-form-field hint="Field select dalam kondisi nonaktif (disabled).">
      <label wuiLabel>Negara (disabled)</label>
      <wui-select wuiInput placeholder="Pilih negara" disabled [value]="negara()">
        <wui-option>Indonesia</wui-option>
        <wui-option>Malaysia</wui-option>
        <wui-option>Singapura</wui-option>
      </wui-select>
    </wui-form-field>
  </div>
</div>
