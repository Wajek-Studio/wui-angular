<wui-form-field 
  hint="Pilih hak akses untuk pengguna ini."
  [error]="pesanError"
>
  <label wuiLabel>Peran Akun (Role)</label>
  <wui-select 
    wuiInput 
    placeholder="Pilih peran pengguna"
    [value]="selectedRole"
    (valueChange)="onRoleChange($event)"
  >
    <wui-option value="admin">Administrator</wui-option>
    <wui-option value="manager">Manager Operasional</wui-option>
    <wui-option value="staff">Staff Petugas</wui-option>
    <wui-option value="investor">Investor Mitra</wui-option>
  </wui-select>
</wui-form-field>
