<!-- Dialog sistem: konfirmasi atau pesan error singkat -->
<div class="dialog-actions-demo">
  <button wuiButton (click)="alertError()">
    Error API — 1 Tombol
  </button>

  <button wuiButton variant="outlined" (click)="alertRetry()">
    Error API + Coba Lagi
  </button>

  <button wuiButton variant="outlined" color="error" (click)="alertWajib()">
    Wajib Dipilih (Tanpa Dismiss)
  </button>
</div>

<p class="hasil">Hasil: <strong>{{ hasilAlert }}</strong></p>
