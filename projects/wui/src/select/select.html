<span class="wui-select--placeholder">{{ placeholder() }}</span>
<span class="wui-select--value">
  {{selectedOption()?.getLabel()}}
</span>
<svg class="wui-select--caret" viewBox="0 0 24 24"><path d="M7,10L12,15L17,10H7Z" fill="currentColor" /></svg>
<ng-template #panel>
  <div class="wui-select--panel" wuiScrollbar>
    <div class="select-panel--list">
      <ng-content />
    </div>
  </div>
</ng-template>
