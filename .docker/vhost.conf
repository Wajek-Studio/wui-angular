<Directory /workspace/www/browser>
    Options FollowSymlinks Indexes
    AllowOverride all
    Require all granted
</Directory>

<Directory /workspace/dist/showcase/browser>
    Options FollowSymlinks Indexes
    AllowOverride all
    Require all granted
</Directory>

<VirtualHost *:80>
    DocumentRoot    /workspace/www/browser
    DirectoryIndex  index.html index.csr.html

    Alias /showcase /workspace/dist/showcase/browser
</virtualHost>